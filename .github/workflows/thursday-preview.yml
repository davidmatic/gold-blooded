name: Thursday preview

# Runs the Thursday preview publish job, after the Wednesday injury report. The job places the
# date on the 49ers' nflverse schedule: in a Game Week it writes the Game Preview and Stat Breakdown onto the
# Game Week Page, in a Bye Week a season recap, and in the Offseason nothing (no commit, no
# deploy). On a published result it commits the new content to main and deploys the site. On
# a rejected result the job fails (GitHub notifies the owner), nothing is committed, and the
# site keeps its previous version.
#
# Uses the real adapters: it fetches the schedule and the Preferred Sources and writes with
# Claude. The API key is the ANTHROPIC_API_KEY repository secret (see README: Secrets and cost).

on:
  schedule:
    - cron: "0 16 * * 4" # Thursdays 16:00 UTC = 8am / 9am Pacific
  workflow_dispatch:
    inputs:
      date:
        description: Date to run for (YYYY-MM-DD, Pacific). Defaults to today.
        required: false

permissions:
  contents: read

concurrency:
  group: content-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the Thursday preview job
        run: npx tsx scripts/publish.ts thursday-preview --adapters real ${DATE:+--date "$DATE"}
        env:
          DATE: ${{ inputs.date }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit new content
        id: commit
        run: |
          mkdir -p content && git add content
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Thursday preview for ${DATE:-$(TZ=America/Los_Angeles date +%F)}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          DATE: ${{ inputs.date }}

  deploy:
    needs: publish
    if: needs.publish.outputs.sha != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.publish.outputs.sha }}
